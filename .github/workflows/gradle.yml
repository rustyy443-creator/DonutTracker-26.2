name: Build DonutTracker

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build mod
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '9.5.1'
          arguments: build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: DonutTracker-mod
          path: build/libs/*.jar
